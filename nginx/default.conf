# ==========================================
# VULMINI — Nginx Configuration
# ==========================================
# Domain: vulmini.cdk.app | SSL: Let's Encrypt
# FastCGI cache for non-authorized users | Security hardening

# ── FastCGI Cache Zone ──
fastcgi_cache_path /var/cache/nginx/wordpress
    levels=1:2
    keys_zone=VULMINI_CACHE:100m
    inactive=60m
    max_size=1g
    use_temp_path=off;

fastcgi_cache_key "$scheme$request_method$host$request_uri";

# ── Rate Limiting ──
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=wp_api:10m rate=10r/s;

# ── Upstream ──
upstream php_fpm {
    server vulmini_app:9000;
}

# ── HTTP → HTTPS Redirect + Let's Encrypt Challenge ──
server {
    listen 80;
    listen [::]:80;
    server_name vulmini.cdk.app;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx health check (for Docker healthcheck)
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Main Server Block ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vulmini.cdk.app;

    root /var/www/html;
    index index.php index.html;

    # ── SSL (Let's Encrypt) ──
    ssl_certificate /etc/letsencrypt/live/vulmini.cdk.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vulmini.cdk.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vulmini.cdk.app/chain.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # ── Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Client Settings ──
    client_max_body_size 2G;
    client_body_buffer_size 128k;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml;

    # ── FastCGI Cache Bypass Logic ──
    set $skip_cache 0;

    # POST requests and URLs with query strings
    if ($request_method = POST) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }

    # WordPress admin, feeds, LearnDash API
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml|/sfwd-lms/") {
        set $skip_cache 1;
    }

    # Logged-in users and LearnDash sessions
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|learndash_") {
        set $skip_cache 1;
    }

    # ── Locations ──

    # WordPress permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP processing via FastCGI
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # FastCGI Cache
        fastcgi_cache VULMINI_CACHE;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        add_header X-Vulmini-Cache $upstream_cache_status;

        # Timeouts for heavy LearnDash operations
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Static Assets — Long Expires ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|mp4|mp3|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # ── MCP Server Reverse Proxy ──
    location /mcp {
        proxy_pass http://vulmini_mcp:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WordPress Hardening ──

    # Block PHP in uploads (protection against shell injections)
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Protect wp-config.php
    location = /wp-config.php {
        deny all;
    }

    # Block XML-RPC (unused)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate limiting for wp-login.php (brute-force protection)
    location = /wp-login.php {
        limit_req zone=wp_login burst=3 nodelay;
        fastcgi_pass php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Rate limiting for REST API
    location /wp-json/ {
        limit_req zone=wp_api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # LearnDash REST API (slightly softer limits)
    location /wp-json/ldlms/ {
        limit_req zone=wp_api burst=30 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # Hide dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Let's Encrypt challenge (for certbot updates)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx health (internal)
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
