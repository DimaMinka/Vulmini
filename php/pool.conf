; ==========================================
; VULMINI — PHP-FPM Pool Configuration
; ==========================================
; Оптимизирован для Vultr HF: 2-4 vCPU / 4-8 GB RAM
; Формула: max_children = (RAM - OS - DB - Redis) / ~50MB per WP process

[www]
; Пользователь
user = www-data
group = www-data

; Слушаем на порту 9000 (Docker networking)
listen = 0.0.0.0:9000

; ── Process Manager ──
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500
pm.process_idle_timeout = 10s

; ── Мониторинг ──
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; ── Логирование ──
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 300s
catch_workers_output = yes
decorate_workers_output = no

; ── PHP Settings Override ──
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 2G
php_admin_value[post_max_size] = 2G
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
php_admin_value[max_input_vars] = 5000

; ── OPcache ──
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.revalidate_freq] = 60
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.save_comments] = 1

; ── Error Handling (Production) ──
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT
php_admin_value[error_log] = /proc/self/fd/2
